name: Commercial loader smoke
on:
  pull_request:
    paths:
      - 'commercial-enquiries.js'
      - 'tests/commercial-enquiries-loader.test.js'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/commercial-enquiries-loader.test.js
