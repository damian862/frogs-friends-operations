name: Smoke tests

on:
  push:
    branches:
      - booking-breaks-preview
  pull_request:
    branches:
      - main
      - perf/dedupe-income-staffing-reads

permissions:
  contents: write

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Run runtime tests
        run: npm test
      - name: Upload verified runtime
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-runtime
          path: dist
          retention-days: 2
      - name: Promote verified runtime
        if: github.head_ref == 'refactor/consolidate-app-modules'
        run: node scripts/promote-maintained-runtime.js
      - name: Verify promoted maintained runtime
        if: github.head_ref == 'refactor/consolidate-app-modules'
        run: npm test
      - name: Commit promoted maintained runtime
        if: github.head_ref == 'refactor/consolidate-app-modules'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Promote seven maintained runtime modules"
          git push origin HEAD:${{ github.head_ref }}
